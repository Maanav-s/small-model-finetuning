[project]
name = "small-model-finetuning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.13.0",
    "anthropic>=0.109.2",
    "beautifulsoup4>=4.15.0",
    "bitsandbytes>=0.49.2",
    "boto3>=1.43.39",
    "fastapi>=0.137.1",
    "jmespath>=1.1.0",
    "jsonschema>=4.26.0",
    "markdownify>=1.2.3",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "openai>=2.45.0",
    "peft>=0.19.1",
    "playwright>=1.61.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "torch>=2.11.0",
    "transformers>=5.10.2",
    "trl>=1.5.1",
    "uvicorn[standard]>=0.49.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
