<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trace Review</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --border: #e2e5ea; --text: #1a1d21;
    --muted: #6b7280; --accent: #2563eb;
    --keep: #16a34a; --keep-bg: #dcfce7; --reject: #dc2626; --reject-bg: #fee2e2;
    --review: #d97706; --review-bg: #fef3c7; --code: #f1f3f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171a; --panel: #1c2024; --border: #2c3238; --text: #e6e9ee;
      --muted: #9aa4b0; --accent: #60a5fa;
      --keep: #4ade80; --keep-bg: #14351f; --reject: #f87171; --reject-bg: #3a1717;
      --review: #fbbf24; --review-bg: #3a2c0f; --code: #161a1e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--text);
  }
  header {
    position: sticky; top: 0; z-index: 5; display: flex; gap: 16px; align-items: center;
    flex-wrap: wrap; padding: 10px 18px; background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 700; }
  .progress { font-variant-numeric: tabular-nums; color: var(--muted); }
  .progress b { color: var(--text); }
  .spacer { flex: 1; }
  button, select {
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  .layout { display: grid; grid-template-columns: 300px 1fr; gap: 0; height: calc(100vh - 53px); }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } aside { display: none; } }
  aside {
    border-right: 1px solid var(--border); overflow-y: auto; background: var(--panel);
  }
  .navitem {
    padding: 8px 12px; border-bottom: 1px solid var(--border); cursor: pointer;
    display: flex; gap: 8px; align-items: center; font-size: 13px;
  }
  .navitem:hover { background: var(--bg); }
  .navitem.active { background: var(--review-bg); }
  .navitem .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-g { font-size: 11px; font-variant-numeric: tabular-nums; padding: 0 5px; border-radius: 999px; flex: none; }
  .nav-g.g-red { background: var(--reject-bg); color: var(--reject); }
  .nav-g.g-amber { background: var(--review-bg); color: var(--review); }
  .nav-g.g-green { background: var(--keep-bg); color: var(--keep); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--muted); }
  .dot.keep { background: var(--keep); } .dot.reject { background: var(--reject); }
  main { overflow-y: auto; padding: 22px 26px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
  .title { font-size: 26px; font-weight: 700; margin: 0 0 2px; }
  .sub { color: var(--muted); margin-bottom: 12px; }
  .badges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .badge { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); }
  .badge.found { background: var(--keep-bg); color: var(--keep); border-color: transparent; }
  .badge.notfound { background: var(--reject-bg); color: var(--reject); border-color: transparent; }
  .badge.diet { background: var(--review-bg); color: var(--review); border-color: transparent; }
  .notes { background: var(--code); border-left: 3px solid var(--accent); padding: 12px 14px; border-radius: 6px; white-space: pre-wrap; }
  h3.sec { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 18px 0 8px; }
  .menu-section { margin-bottom: 14px; }
  .menu-section .sname { font-weight: 700; margin-bottom: 4px; }
  .item { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; border-bottom: 1px dashed var(--border); }
  .item .iname { font-weight: 500; }
  .item .idesc { color: var(--muted); font-size: 13px; }
  .item .price { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--accent); }
  a { color: var(--accent); word-break: break-all; }
  details { margin-top: 8px; }
  summary { cursor: pointer; font-weight: 600; }
  .turn { border-left: 2px solid var(--border); padding: 4px 0 4px 12px; margin: 8px 0; }
  .turn .role { font-size: 12px; text-transform: uppercase; color: var(--muted); }
  .tool-call { font-family: ui-monospace, Menlo, monospace; font-size: 13px; background: var(--code); padding: 4px 8px; border-radius: 6px; margin: 4px 0; }
  .tool-result { font-family: ui-monospace, Menlo, monospace; font-size: 12px; background: var(--code); padding: 6px 8px; border-radius: 6px; margin: 4px 0; white-space: pre-wrap; max-height: 180px; overflow: auto; }
  .decide { position: sticky; bottom: 0; display: flex; gap: 12px; padding: 14px 0 4px; background: linear-gradient(transparent, var(--bg) 30%); }
  .btn-keep { font-size: 16px; font-weight: 700; padding: 12px 26px; border-radius: 10px; }
  .btn-keep.on { background: var(--keep); color: #fff; border-color: var(--keep); }
  .btn-reject { font-size: 16px; font-weight: 700; padding: 12px 26px; border-radius: 10px; }
  .btn-reject.on { background: var(--reject); color: #fff; border-color: var(--reject); }
  .hint { color: var(--muted); font-size: 12px; align-self: center; }
  .toast { position: fixed; bottom: 18px; right: 18px; background: var(--panel); border: 1px solid var(--border); padding: 10px 16px; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.2); opacity: 0; transition: opacity .2s; }
  .toast.show { opacity: 1; }
  .sibling-panel { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; background: var(--code); }
  .sibling-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-bottom: 8px; }
  .sibling-head .rname { font-weight: 700; }
  .grounding { font-variant-numeric: tabular-nums; font-weight: 700; padding: 1px 8px; border-radius: 999px; }
  .grounding.g-red { background: var(--reject-bg); color: var(--reject); }
  .grounding.g-amber { background: var(--review-bg); color: var(--review); }
  .grounding.g-green { background: var(--keep-bg); color: var(--keep); }
  .pill { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .item.unmatched { background: var(--reject-bg); border-radius: 4px; }
  .item.unmatched .iname::after { content: " ⚠ not in scrape"; color: var(--reject); font-size: 11px; font-weight: 600; }
  .unmatched-note { color: var(--muted); font-size: 12px; margin: 6px 0 2px; }
  .sib-items { margin: 6px 0 2px; }
  .sib-item { padding: 4px 0; border-bottom: 1px dashed var(--border); }
  .sib-item .iname { font-weight: 600; }
  .sib-item.matched-item .iname { color: var(--keep); }
  .sib-item.unmatched-item { background: var(--reject-bg); border-radius: 4px; padding: 4px 6px; }
  .sib-item .miss { color: var(--reject); font-size: 11px; font-weight: 600; }
  .sib-ctx { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted); margin-top: 2px; word-break: break-word; }
  .sib-ctx mark { background: var(--review-bg); color: var(--text); border-radius: 3px; padding: 0 2px; font-weight: 700; }
  .sib-src { font-size: 11px; margin-top: 2px; }
  .open-sib { margin: 8px 0 4px; font-size: 13px; }
  .sibling-actions { margin: 8px 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .sibling-actions button { font-size: 13px; padding: 5px 12px; }
  .sibling-actions .sib-reject.on { background: var(--reject); color: #fff; border-color: var(--reject); }
  .sibling-actions .sib-keep.on { background: var(--keep); color: #fff; border-color: var(--keep); }
  .sibling-actions .sib-actlabel { color: var(--muted); font-size: 12px; }
  .sib-decided { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: .04em; }
  .sib-decided.reject { background: var(--reject); color: #fff; }
  .sib-decided.keep { background: var(--keep); color: #fff; }
  .sibling-panel.sib-rejected { border-color: var(--reject); box-shadow: inset 0 0 0 1px var(--reject); }
  .sibling-view-banner { background: var(--review-bg); color: var(--review); padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .sibling-view-banner .lbl { font-weight: 700; text-transform: uppercase; font-size: 12px; letter-spacing: .04em; }
  .tr-full { font-size: 11px; margin-top: 4px; padding: 2px 8px; }
  .tool-result.expanded { max-height: 480px; }
</style>

<header>
  <h1>Trace Review</h1>
  <span class="progress" id="progress">…</span>
  <div class="spacer"></div>
  <label class="hint">scope
    <select id="scope">
      <option value="notfound">not-found</option>
      <option value="all">all</option>
    </select>
  </label>
</header>

<div class="layout">
  <aside id="nav"></aside>
  <main id="main"><p class="hint">Loading…</p></main>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
// viewingSibling: when set ({backTo}) the detail pane shows a sibling's FULL trace
// as a read-only detour (no decide buttons); "← back" returns to backTo.
let state = { scope: "notfound", list: [], idx: 0, detail: null, agg: null, viewingSibling: null };

function esc(s) { return (s == null ? "" : String(s)).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), 1600); }

async function loadList() {
  const r = await fetch(`/api/review/traces?scope=${state.scope}`);
  const d = await r.json();
  state.list = d.traces; state.agg = d.aggregate;
  if (state.idx >= state.list.length) state.idx = Math.max(0, state.list.length - 1);
  renderNav(); renderProgress();
  if (state.list.length) loadDetail(state.list[state.idx].trace_id);
  else $("#main").innerHTML = "<p class='hint'>No traces in this scope.</p>";
}

function renderProgress() {
  const a = state.agg || {};
  $("#progress").innerHTML = `<b>${a.kept + a.rejected}</b>/${a.total} reviewed — ` +
    `<b>${a.kept}</b> keep, <b>${a.rejected}</b> reject, ${a.undecided} left`;
}

function renderNav() {
  const nav = $("#nav");
  nav.innerHTML = state.list.map((t, i) => {
    const cls = t.decision === "keep" ? "keep" : t.decision === "reject" ? "reject" : "";
    const g = typeof t.grounding === "number"
      ? `<span class="nav-g ${groundingClass(t.grounding)}" title="${Math.round(t.grounding*100)}% of the menu is grounded in the scrape">${Math.round(t.grounding*100)}%</span>` : "";
    return `<div class="navitem ${i === state.idx ? "active" : ""}" data-i="${i}">
      <span class="dot ${cls}"></span>
      <span class="nm" title="${esc(t.restaurant_name)}">${esc(t.restaurant_name || t.trace_id)}</span>
      ${g}
      ${t.found ? "" : "<span class='hint'>✗</span>"}
    </div>`;
  }).join("");
  nav.querySelectorAll(".navitem").forEach(el =>
    el.onclick = () => { state.idx = +el.dataset.i; loadDetail(state.list[state.idx].trace_id); renderNav(); });
  const active = nav.querySelector(".navitem.active");
  if (active) active.scrollIntoView({ block: "nearest" });
}

async function loadDetail(traceId) {
  state.viewingSibling = null;           // normal nav is always a primary (queue) trace
  const r = await fetch(`/api/review/trace/${encodeURIComponent(traceId)}`);
  state.detail = await r.json();
  renderDetail();
}

// Read-only detour: load a sibling's FULL trace into the same detail view even
// though it isn't in the current nav scope. "backTo" is the queue trace to return to.
async function openSibling(traceId, backTo) {
  const r = await fetch(`/api/review/trace/${encodeURIComponent(traceId)}`);
  state.detail = await r.json();
  state.viewingSibling = { backTo };
  renderDetail();
  $("#main").scrollTop = 0;
}

function menuHtml(menu) {
  if (!menu || !menu.length) return "<p class='hint'>— no menu items —</p>";
  return menu.map(sec => `<div class="menu-section">
    <div class="sname">${esc(sec.section || "")}</div>
    ${(sec.items || []).map(it => `<div class="item">
      <span><span class="iname">${esc(it.name)}</span>
      ${it.description ? `<span class="idesc"> — ${esc(it.description)}</span>` : ""}</span>
      <span class="price">${esc(it.price || "")}</span></div>`).join("")}
  </div>`).join("");
}

function groundingClass(g) { return g < 0.5 ? "g-red" : g <= 0.8 ? "g-amber" : "g-green"; }

// Turn the server's 〈…〉 match markers into a <mark> highlight (escape text first;
// the markers are plain unicode so esc() leaves them intact to be swapped after).
function markHtml(context) {
  return esc(context).split("〈").join("<mark>").split("〉").join("</mark>");
}

// Per-item evidence: WHERE each sibling menu item was found in the scraped text.
function siblingItemsHtml(items) {
  if (!items || !items.length) return "";
  return `<div class="sib-items">` + items.map(it => {
    if (it.matched) {
      return `<div class="sib-item matched-item">
        <span class="iname">${esc(it.name)}</span>
        ${it.context ? `<div class="sib-ctx">found in scrape: ${markHtml(it.context)}</div>` : ""}
        ${it.source_hint ? `<div class="sib-src"><a href="${esc(it.source_hint)}" target="_blank" rel="noopener">${esc(it.source_hint)}</a></div>` : ""}
      </div>`;
    }
    return `<div class="sib-item unmatched-item">
      <span class="iname">${esc(it.name)}</span> <span class="miss">⚠ not in scrape</span></div>`;
  }).join("") + `</div>`;
}

function siblingMenuHtml(menu, unmatched) {
  if (!menu || !menu.length) return "<p class='hint'>— no menu items —</p>";
  const bad = new Set((unmatched || []).map(n => String(n).toLowerCase()));
  return menu.map(sec => `<div class="menu-section">
    <div class="sname">${esc(sec.section || "")}</div>
    ${(sec.items || []).map(it => {
      const miss = bad.has(String(it.name || "").toLowerCase());
      return `<div class="item${miss ? " unmatched" : ""}">
      <span><span class="iname">${esc(it.name)}</span>
      ${it.description ? `<span class="idesc"> — ${esc(it.description)}</span>` : ""}</span>
      <span class="price">${esc(it.price || "")}</span></div>`;
    }).join("")}
  </div>`).join("");
}

function siblingsHtml(siblings) {
  if (!siblings || !siblings.length) return "";
  const cards = siblings.map(s => {
    const hasG = typeof s.grounding === "number";
    const g = hasG ? s.grounding : null;
    const restr = Array.isArray(s.restrictions) && s.restrictions.length
      ? s.restrictions.join(", ") : "free";
    const groundingBadge = hasG
      ? `<span class="grounding ${groundingClass(g)}">${Math.round(g * 100)}% grounded</span>`
      : `<span class="pill">not found</span>`;
    const open = ((hasG && g < 0.5) || s.decision === "reject") ? " open" : "";
    const um = s.unmatched_items || [];
    const rejected = s.decision === "reject";
    const kept = s.decision === "keep";
    const decidedBadge = rejected ? `<span class="sib-decided reject">rejected</span>`
      : kept ? `<span class="sib-decided keep">kept</span>` : "";
    const sf = esc(s.sibling_trace_id);
    return `<details class="sibling-panel${rejected ? " sib-rejected" : ""}"${open}>
      <summary>
        <span class="sibling-head">
          <span class="rname">${esc(s.restaurant_name || s.sibling_trace_id || "sibling")}</span>
          ${decidedBadge}
          <span class="pill">${esc(restr)}</span>
          ${groundingBadge}
          <span class="pill">${esc(s.n_items)} items</span>
        </span>
      </summary>
      ${s.source_url ? `<div><a href="${esc(s.source_url)}" target="_blank" rel="noopener">${esc(s.source_url)}</a></div>` : ""}
      <div class="sibling-actions">
        <button class="open-sib" data-open-sib="${sf}">Open full trace →</button>
        <span class="sib-actlabel">this sibling:</span>
        <button class="sib-reject${rejected ? " on" : ""}" data-sib-decide="reject" data-sib-trace="${sf}"
          title="Drop this sibling from SFT — wrong restaurant / bad menu">Reject sibling (wrong restaurant / bad menu)</button>
        <button class="sib-keep${kept ? " on" : ""}" data-sib-decide="keep" data-sib-trace="${sf}">Keep sibling</button>
        <button data-sib-decide="undo" data-sib-trace="${sf}">Undo</button>
      </div>
      ${um.length ? `<div class="unmatched-note">${um.length} item(s) not found literally in the scraped text (the hallucination tell):</div>` : ""}
      ${(s.items && s.items.length) ? siblingItemsHtml(s.items) : siblingMenuHtml(s.menu, um)}
    </details>`;
  }).join("");
  return `<h3 class="sec">sibling slices (same restaurant) — compare menus &amp; cross-check identity</h3>${cards}`;
}

function convoHtml(convo) {
  return (convo || []).map(t => `<div class="turn">
    <div class="role">${esc(t.role)}</div>
    ${t.text ? `<div>${esc(t.text)}</div>` : ""}
    ${t.tool_calls.map(c => `<div class="tool-call">→ ${esc(c.name)}(${esc(JSON.stringify(c.input))})</div>`).join("")}
    ${t.tool_results.map(r => `<div class="tool-result" data-turn="${r.turn}" data-idx="${r.idx}">
      <div class="tr-body">${esc(r.preview)}${r.truncated ? `\n…(+${r.full_len - r.preview.length} more chars)` : ""}</div>
      ${r.truncated ? `<button class="tr-full" data-turn="${r.turn}" data-idx="${r.idx}">show full (${r.full_len} chars) ▾</button>` : ""}
    </div>`).join("")}
  </div>`).join("");
}

function renderDetail() {
  const d = state.detail;
  if (!d || !d.ok) { $("#main").innerHTML = `<p class='hint'>${esc(d && d.error || "error")}</p>`; return; }
  const preselect = d.decision || null;
  const diet = d.dietary_restrictions;
  const dietStr = Array.isArray(diet) ? diet.join(", ") : diet;
  const g = typeof d.grounding === "number" ? d.grounding : null;
  const sib = state.viewingSibling;

  $("#main").innerHTML = `
    ${sib ? `<div class="sibling-view-banner">
      <button id="bback">← back</button>
      <span class="lbl">viewing sibling</span>
      <span>read-only — not part of the review queue</span>
    </div>` : ""}
    <div class="card">
      <div class="title">${esc(d.restaurant_name || "(unnamed)")}</div>
      <div class="sub">${esc(d.episode_input)}</div>
      <div class="badges">
        <span class="badge ${d.found ? "found" : "notfound"}">${d.found ? "found" : "not found"}</span>
        <span class="badge">${d.n_items} items</span>
        ${g !== null ? `<span class="grounding ${groundingClass(g)}" title="fraction of this menu's items found literally in what the agent scraped/searched">${Math.round(g*100)}% grounded</span>` : ""}
        <span class="badge">schema ${d.schema_valid ? "valid" : "INVALID"}</span>
        ${dietStr ? `<span class="badge diet">diet: ${esc(dietStr)}</span>` : ""}
        <span class="badge">${esc(d.trace_id)}</span>
      </div>
      ${d.notes ? `<h3 class="sec">notes (teacher's reason)</h3><div class="notes">${esc(d.notes)}</div>` : ""}
      ${d.source_url ? `<h3 class="sec">source</h3><a href="${esc(d.source_url)}" target="_blank" rel="noopener">${esc(d.source_url)}</a>` : ""}
      ${siblingsHtml(d.siblings)}
      <h3 class="sec">menu</h3>${menuHtml(d.menu)}
      <details>
        <summary>agent trace (${(d.queries || []).length} queries, ${(d.urls || []).length} urls, ${(d.conversation || []).length} turns)</summary>
        <h3 class="sec">queries</h3>${(d.queries || []).map(q => `<div class="tool-call">${esc(q)}</div>`).join("") || "<span class='hint'>—</span>"}
        <h3 class="sec">scraped urls</h3>${(d.urls || []).map(u => `<div><a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a></div>`).join("") || "<span class='hint'>—</span>"}
        <h3 class="sec">conversation</h3>${convoHtml(d.conversation)}
      </details>
    </div>
    ${sib ? `<div class="decide">
      <button id="bback2">← back to review</button>
      <span class="hint">viewing a sibling trace — decisions are made on the queue trace</span>
    </div>` : `<div class="decide">
      <button class="btn-keep ${preselect === "keep" ? "on" : ""}" id="bkeep">Keep (a)</button>
      <button class="btn-reject ${preselect === "reject" ? "on" : ""}" id="breject">Reject (r)</button>
      <button id="bundo">Undo (u)</button>
      <span class="hint">← prev · → next · auto-advances on decide</span>
    </div>`}`;

  if (sib) {
    const back = () => loadDetail(sib.backTo);
    if ($("#bback")) $("#bback").onclick = back;
    if ($("#bback2")) $("#bback2").onclick = back;
  } else {
    $("#bkeep").onclick = () => decide("keep");
    $("#breject").onclick = () => decide("reject");
    $("#bundo").onclick = () => decide("undo");
  }

  // Open a sibling's full trace (read-only detour); back returns to this trace.
  $("#main").querySelectorAll("[data-open-sib]").forEach(el =>
    el.onclick = () => openSibling(el.dataset.openSib, d.trace_id));

  // Keep/Reject/Undo a SIBLING directly from its evidence panel. Acts on the
  // sibling's own trace_id (another slice of the same restaurant), separate from
  // the primary trace's decision.
  $("#main").querySelectorAll("[data-sib-decide]").forEach(el =>
    el.onclick = () => decideSibling(el.dataset.sibTrace, el.dataset.sibDecide));

  // Expand a truncated tool-result preview to its full text (fetched on demand).
  $("#main").querySelectorAll(".tr-full").forEach(btn => btn.onclick = async () => {
    const { turn, idx } = btn.dataset;
    const r = await fetch(`/api/review/toolresult/${encodeURIComponent(d.trace_id)}?turn=${turn}&idx=${idx}`);
    const full = await r.json();
    if (!full.ok) { toast(full.error || "error"); return; }
    const box = btn.closest(".tool-result");
    box.querySelector(".tr-body").textContent = full.text;
    box.classList.add("expanded");
    btn.remove();
  });

  $("#main").scrollTop = 0;
}

async function decide(decision) {
  if (state.viewingSibling) return;   // read-only detour: no deciding on a sibling
  const cur = state.list[state.idx];
  if (!cur) return;
  const r = await fetch(`/api/review/decision`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ trace_id: cur.trace_id, decision }),
  });
  const d = await r.json();
  if (!d.ok) { toast(d.error || "error"); return; }
  cur.decision = d.decision; state.agg = d.aggregate; state.detail.decision = d.decision;
  renderProgress(); renderNav();
  if (decision === "undo") { renderDetail(); return; }
  advanceToNextUndecided();
}

// Decide on a SIBLING (another slice of the same restaurant) from its evidence
// panel. Posts the sibling's trace_id to the same endpoint, then reloads the
// current detail so the panel badge refreshes. The returned aggregate is the
// global review progress, so the header stays in sync too.
async function decideSibling(traceId, decision) {
  const r = await fetch(`/api/review/decision`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ trace_id: traceId, decision }),
  });
  const d = await r.json();
  if (!d.ok) { toast(d.error || "error"); return; }
  state.agg = d.aggregate;
  toast(decision === "undo" ? "Sibling decision cleared" : `Sibling ${decision}ed`);
  const cur = state.detail && state.detail.trace_id;
  if (cur) await loadDetail(cur);
  renderNav(); renderProgress();
}

function advanceToNextUndecided() {
  const n = state.list.length;
  for (let k = 1; k <= n; k++) {
    const j = (state.idx + k) % n;
    if (!state.list[j].decision) { state.idx = j; loadDetail(state.list[j].trace_id); renderNav(); return; }
  }
  // none left undecided: just go to next
  go(1);
}

function go(delta) {
  const n = state.list.length; if (!n) return;
  state.idx = (state.idx + delta + n) % n;
  loadDetail(state.list[state.idx].trace_id); renderNav();
}

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
  if (e.key === "a" || e.key === "k") { e.preventDefault(); decide("keep"); }
  else if (e.key === "r") { e.preventDefault(); decide("reject"); }
  else if (e.key === "u") { e.preventDefault(); decide("undo"); }
  else if (e.key === "ArrowRight") { e.preventDefault(); go(1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); }
});

$("#scope").onchange = (e) => { state.scope = e.target.value; state.idx = 0; loadList(); };

loadList();
</script>
